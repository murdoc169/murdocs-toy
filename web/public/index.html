<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murdoc's Toy</title>
<style>
  :root { --bg:#12151a; --panel:#1b2028; --line:#2b3340; --text:#e6e9ee; --mute:#8b95a5; --back:#5aa9e6; --backbg:#1d3b57; --lay:#ee7b9b; --laybg:#5a2a3a; --accent:#f5c542; --ok:#4cc38a; --bad:#ef5b5b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,Segoe UI,sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; gap:10px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; color:var(--accent); }
  input,select,button { background:#0e1116; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .grow { flex:1; } .mute { color:var(--mute); } .warn { color:#ffb454; font-weight:600; }
  main { display:grid; grid-template-columns:320px 1fr 340px; min-height:0; }
  section { min-height:0; overflow:auto; border-right:1px solid var(--line); }
  #markets { padding:6px 0; font-size:13px; }
  .node { padding:3px 8px 3px 0; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node:hover, .node.sel { background:var(--panel); } .node.sel { color:var(--accent); }
  .node .tw { display:inline-block; width:16px; text-align:center; color:var(--mute); }
  .node small { color:var(--mute); margin-left:6px; }
  .node .star { cursor:pointer; margin-right:4px; color:var(--accent); } .node .star:hover { filter:brightness(1.4); }
  .node .score { margin-left:8px; padding:0 6px; border-radius:4px; background:#1d3b57; color:#fff; font-weight:700; font-size:12px; }
  .node.live { font-weight:600; }
  #scoreBar { text-align:center; font:700 18px system-ui; padding:8px; background:#12151a; border-bottom:1px solid var(--line); }
  #scoreBar.flash { background:var(--accent); color:#000; }
  .kids { margin-left:14px; border-left:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; }
  th { font-weight:500; color:var(--mute); text-align:center; padding:6px; position:sticky; top:0; background:var(--bg); }
  td { text-align:center; padding:4px 6px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  td.name { text-align:left; font-weight:600; }
  td.b { background:var(--backbg); color:var(--back); } td.l { background:var(--laybg); color:var(--lay); }
  td small { display:block; color:var(--mute); font-size:11px; }
  tr.runner { cursor:pointer; } tr.runner.sel td.name { color:var(--accent); } tr.runner.out { opacity:.4; }
  #ladder td { padding:2px 8px; font-size:13px; cursor:default; } #ladder td.price { font-weight:700; background:#0e1116; }
  #ladder td.b, #ladder td.l { cursor:pointer; } #ladder td.b:hover { outline:1px solid var(--back); } #ladder td.l:hover { outline:1px solid var(--lay); }
  #ladder tr.ltp td.price { background:var(--accent); color:#000; }
  #ladder .vol { color:var(--mute); }
  aside { padding:10px; border:0; }
  h3 { margin:12px 0 6px; font-size:13px; color:var(--mute); text-transform:uppercase; letter-spacing:.05em; }
  .stakes button { margin:0 4px 4px 0; } .stakes button.on { border-color:var(--accent); color:var(--accent); }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); padding:10px 16px; border-radius:8px; display:none; }
  #login { max-width:340px; margin:12vh auto; background:var(--panel); padding:20px; border-radius:10px; display:grid; gap:10px; }
  .hidden { display:none !important; }
  @media (max-width:1000px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Murdoc's Toy</h1>
  <select id="sport"></select>
  <input id="q" placeholder="search matches" size="18">
  <label><input type="checkbox" id="inplay"> in-play</label>
  <label title="Open a favorite match's ladder whenever its score changes (browsers may ask you to allow pop-ups)"><input type="checkbox" id="autoopen"> auto-open favorites on score change</label>
  <button id="find">Find</button>
  <span class="grow"></span>
  <span id="delayed" class="warn"></span>
  <span id="funds" class="mute"></span>
</header>

<div id="login" class="hidden">
  <h2 style="margin:0">Betfair login</h2>
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <input id="k" placeholder="app key" autocomplete="off">
  <label class="mute"><input type="checkbox" id="rem" checked> remember username and app key</label>
  <button id="go">Log in</button>
  <div id="loginerr" class="warn"></div>
</div>

<main id="app" class="hidden">
  <section id="markets"></section>
  <section>
    <div id="scoreBar" class="hidden"></div>
    <div id="liq" style="border-bottom:1px solid var(--line)"></div>
    <table><thead><tr><th style="text-align:left">Runner</th><th>Back 3</th><th>Back 2</th><th>Back</th><th>Lay</th><th>Lay 2</th><th>Lay 3</th><th>Last</th><th>Matched</th></tr></thead><tbody id="runners"></tbody></table>
    <h3 style="padding:0 10px">Current orders <span class="mute">(click to cancel)</span></h3>
    <table><tbody id="orders"></tbody></table>
  </section>
  <section style="border:0">
    <aside>
      <h3>Stake</h3>
      <div class="stakes" id="stakes"></div>
      <input id="stake" type="number" min="1" step="1" value="2" style="width:90px">
      <h3 id="ladderTitle">Ladder</h3>
      <table id="ladder"><thead><tr><th>Traded</th><th>Back</th><th>Price</th><th>Lay</th></tr></thead><tbody></tbody></table>
    </aside>
  </section>
</main>
<div id="toast"></div>

<script type="module">
import { window as ticks, LiquidityTracker, short } from './ladder.js';
import { drawLiquidity } from './liquidity.js';
import { findLive, matchScore } from './teams.js';
const $ = id => document.getElementById(id);
const api = async (path, body) => {
  const r = await fetch('/api/' + path, body ? { method: 'POST', headers: { 'X-MT': '1' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || j.error);
  return j;
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = v => (v == null ? '' : +v.toFixed(2)).toString();
const opt = { stakes: [2, 5, 10, 25, 50], stake: 2 };
let state = { types: [], markets: [], market: null, book: null, sel: null, busy: false };

function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }

async function boot() {
  const s = await api('status');
  if (!s.loggedIn) {
    if (s.hasEnvCreds) { try { await api('login', {}); } catch (e) { /* fall through to form */ } }
    if (!(await api('status')).loggedIn) { $('login').classList.remove('hidden'); return; }
  }
  if (s.mirror) await startMirror();
  start();
}
try { const sv = JSON.parse(localStorage.getItem('mt.login') || '{}'); $('u').value = sv.u ?? ''; $('k').value = sv.k ?? ''; } catch { /* ignore */ }
$('go').onclick = async () => {
  try {
    await api('login', { username: $('u').value, password: $('p').value, appKey: $('k').value.trim() || undefined });
    try { if ($('rem').checked) localStorage.setItem('mt.login', JSON.stringify({ u: $('u').value, k: $('k').value.trim() })); else localStorage.removeItem('mt.login'); } catch { /* ignore */ }
    $('login').classList.add('hidden'); start();
  }
  catch (e) { $('loginerr').textContent = e.message; }
};

let mirror = false, mirrorVersion = -1;
async function startMirror() {
  mirror = true;
  try { const o = await api('options'); opt.stakes = o.stakes; opt.stake = o.stake; } catch { /* keep defaults */ }
  const bar = el('span', 'mute'); bar.id = 'mirrorBar'; $('delayed').before(bar);
  bar.textContent = 'Mirroring desktop';
  setInterval(async () => {
    try {
      const m = await api('mirror');
      if (m.version === mirrorVersion) return; mirrorVersion = m.version;
      bar.replaceChildren(document.createTextNode('Mirroring desktop  '));
      for (const l of m.ladders) { const b = el('button', '', 'Ladder: ' + l.name); b.onclick = () => popup(l.marketId); b.style.marginLeft = '4px'; bar.append(b); }
      if (m.selectedMarketId && m.selectedMarketId !== state.market?.marketId) {
        const mk = await api('market?marketId=' + encodeURIComponent(m.selectedMarketId));
        if (mk) pickMarket(mk);
      }
    } catch { /* desktop closed: keep the last view */ }
  }, 1500);
}

async function start() {
  $('app').classList.remove('hidden');
  state.types = await api('eventtypes');
  for (const t of state.types) $('sport').append(new Option(t.name, t.id));
  $('sport').value = state.types.find(t => t.name === 'Soccer')?.id ?? state.types[0].id;
  opt.stakes.forEach(v => { const b = el('button', '', v); b.onclick = () => { $('stake').value = v; markStake(); }; $('stakes').append(b); });
  $('stake').value = opt.stake; markStake(); $('stake').oninput = markStake;
  await find(); funds(); setInterval(poll, 2000); setInterval(funds, 30000);
}
function markStake() { [...$('stakes').children].forEach(b => b.classList.toggle('on', b.textContent === $('stake').value)); }

async function funds() {
  try { const f = await api('funds'); $('funds').textContent = `Balance ${f.available.toFixed(2)} · Exposure ${f.exposure.toFixed(2)}`; } catch (e) { $('funds').textContent = ''; }
}

const sportId = () => $('sport').value;
const inPlay = () => ($('inplay').checked ? 1 : 0);
const qs = o => new URLSearchParams(o).toString();

/** Tree: competition > match > markets (children load when a node is first opened). */
function treeNode(label, sub, loader, onPick, onOpen) {
  const wrap = el('div'); const row = el('div', 'node'); const tw = el('span', 'tw', loader ? '▸' : '·');
  row.append(tw, document.createTextNode(label)); if (sub) row.append(el('small', '', sub));
  const kids = el('div', 'kids hidden'); let loaded = false;
  async function toggle() {
    if (!loader) return;
    const open = kids.classList.contains('hidden');
    if (open && !loaded) { loaded = true; kids.textContent = 'Loading…'; try { kids.replaceChildren(...(await loader())); dispatchEvent(new Event('mt-tree')); } catch (e) { loaded = false; kids.textContent = e.message; } }
    kids.classList.toggle('hidden', !open); tw.textContent = open ? '▾' : '▸';
  }
  row.onclick = () => { document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel')); row.classList.add('sel'); onPick?.(); toggle(); };
  row.ondblclick = () => onOpen?.();
  wrap.append(row, kids); wrap.row = row; wrap.kids = kids;
  wrap.open = async () => { if (kids.classList.contains('hidden')) await toggle(); };
  return wrap;
}
const popup = id => window.open('ladder.html?marketId=' + encodeURIComponent(id), 'ladder-' + id, 'popup,width=1100,height=760');
let tracker = new LiquidityTracker();
function pickMarket(m) { state.market = m; state.book = null; state.sel = null; tracker = new LiquidityTracker(); drawLiquidity($('liq'), tracker); poll(); }
function marketNode(m) { return treeNode(m.marketName, m.totalMatched > 0 ? short(m.totalMatched) : '', null, () => pickMarket(m), () => popup(m.marketId)); }
const favs = new Map();   // eventId -> name
const volumes = {};       // eventId -> matched volume of the match
const opened = new Map(); // marketId -> popup window we opened

/** "[time] Home 0 - 1 Away (145643€)": live score between the teams, match volume after. */
function eventLabel(e, m) {
  const parts = e.name.split(/\s+v\s+/i);
  const game = m && parts.length === 2 ? `${parts[0]} ${m.homeScore} - ${m.awayScore} ${parts[1]}` : m ? `${e.name} [${m.homeScore}-${m.awayScore}]` : e.name;
  const when = !m && e.openDate ? new Date(e.openDate).toLocaleString([], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '  ' : '';
  const vol = volumes[e.id] > 0 ? ` (${Math.floor(volumes[e.id])}€)` : '';
  return when + game + vol;
}

function eventNode(e) {
  const n = treeNode('', '', async () => {
    const ms = await api('eventmarkets?' + qs({ eventId: e.id }));
    return ms.map(marketNode);
  }, null, async () => { const ms = await api('eventmarkets?' + qs({ eventId: e.id })); if (ms[0]) popup(ms[0].marketId); });
  const tw = n.row.firstChild, star = el('span', 'star'), lbl = el('span', 'lbl');
  star.title = 'Favorite'; star.onclick = ev => { ev.stopPropagation(); toggleFav(e); };
  n.row.replaceChildren(tw, star, lbl);
  n.row.dataset.eid = e.id; n.row.dataset.ev = e.name; n.row._e = e;
  lbl.textContent = eventLabel(e, null); star.textContent = favs.has(e.id) ? '★' : '☆';
  return n;
}

async function loadFavs() {
  try { favs.clear(); for (const f of await api('favorites')) favs.set(f.eventId, f.name); } catch { /* keep what we have */ }
  renderFavs(); paintScores(); pollVolumes();
}
/** The ★ Favorites section at the top of the tree. */
function renderFavs() {
  const box = $('markets'); box.querySelector(':scope > [data-fav]')?.remove();
  const node = treeNode(`★ Favorites (${favs.size})`, favs.size ? '' : 'press ☆ next to a match', async () =>
    [...favs].map(([id, name]) => eventNode({ id, name, openDate: null })));
  node.dataset.fav = '1'; box.prepend(node);
  if (favs.size) node.open();
}
async function toggleFav(e) {
  try { await api('favorites', { eventId: e.id, name: e.name, favorite: !favs.has(e.id) }); await loadFavs(); }
  catch (err) { toast(err.message); }
}
async function pollVolumes() {
  const ids = [...new Set([...document.querySelectorAll('.node[data-eid]')].map(r => r.dataset.eid))];
  if (!ids.length) return;
  try { Object.assign(volumes, await api('volumes?ids=' + ids.join(','))); paintScores(); } catch { /* decoration only */ }
}
addEventListener('mt-tree', () => { paintScores(); pollVolumes(); });
setInterval(pollVolumes, 20000);

async function find() {
  const box = $('markets'); box.textContent = 'Loading…';
  try {
    const text = $('q').value.trim();
    const nodes = text
      ? (await api('events?' + qs({ eventTypeId: sportId(), q: text, inPlay: inPlay() }))).map(eventNode)
      : (await api('competitions?' + qs({ eventTypeId: sportId(), inPlay: inPlay() }))).map(c =>
          treeNode(c.name, `(${c.marketCount})`, async () => (await api('events?' + qs({ eventTypeId: sportId(), competitionId: c.id, inPlay: inPlay() }))).map(eventNode)));
    box.replaceChildren(...(nodes.length ? nodes : [el('div', 'node', 'Nothing found')]));
    renderFavs();
    if (!state.market) autoSelect(box);
    pollVolumes();
  } catch (e) { box.textContent = e.message; toast(e.message); }
}
/** Open the first match's Match Odds so the screen is never empty. */
async function autoSelect(box) {
  let node = [...box.children].find(c => !c.dataset.fav);
  if (!node?.open) return;
  if (!$('q').value.trim()) { await node.open(); node = node.kids.children[0]; }   // competition -> its first match
  if (!node?.open) return;
  await node.open();
  const mo = [...node.kids.children].find(c => c.row?.textContent.startsWith('Match Odds')) ?? node.kids.children[0];
  mo?.row?.click();
}
$('find').onclick = find; $('q').onkeydown = e => e.key === 'Enter' && find();
$('inplay').onchange = find; $('sport').onchange = find;

let live = { connected: false, matches: [], alerts: [] }, seenAlert = '', flashUntil = 0;
function paintScores() {
  for (const row of document.querySelectorAll('.node[data-eid]')) {
    const e = row._e, m = findLive(e.name, live.matches);
    row.classList.toggle('live', !!m);
    row.querySelector('.lbl').textContent = eventLabel(e, m);
    row.querySelector('.star').textContent = favs.has(e.id) ? '★' : '☆';
  }
  const bar = $('scoreBar'), m = state.market?.event ? findLive(state.market.event.name, live.matches) : null;
  bar.classList.toggle('hidden', !m);
  if (m) { bar.textContent = `${m.home}  ${m.homeScore} - ${m.awayScore}  ${m.away}`; bar.classList.toggle('flash', Date.now() < flashUntil); }
}
const lastScore = new Map();   // "home|away" -> "h-a"
$('autoopen').checked = (() => { try { return localStorage.getItem('mt.autoopen') === '1'; } catch { return false; } })();
$('autoopen').onchange = () => { try { localStorage.setItem('mt.autoopen', $('autoopen').checked ? '1' : '0'); } catch { /* ignore */ } };

async function openFavoriteLadder(eventId) {
  const ms = await api('eventmarkets?' + qs({ eventId }));
  const mk = ms[0]; if (!mk) return;
  const w = opened.get(mk.marketId);
  if (w && !w.closed) { w.focus(); return; }                     // already open: just raise it
  const win = popup(mk.marketId);
  if (win) opened.set(mk.marketId, win);
  else { pickMarket(mk); toast('Pop-up blocked: showing the ladder here. Allow pop-ups for this site to open windows automatically.', 8000); }
}

function checkScoreChanges() {
  for (const m of live.matches) {
    const key = m.home + '|' + m.away, cur = `${m.homeScore}-${m.awayScore}`, prev = lastScore.get(key);
    lastScore.set(key, cur);
    if (prev === undefined || prev === cur) continue;
    for (const [id, name] of favs) {
      if (matchScore(name, m.home, m.away) <= 0) continue;
      flashUntil = Date.now() + 20000;
      toast(`${name}: ${prev} -> ${cur}`, 8000);
      if ($('autoopen').checked) openFavoriteLadder(id).catch(e => toast(e.message));
    }
  }
}

async function pollLive() {
  try {
    live = await api('live');
    checkScoreChanges();
    const last = live.alerts.at(-1);
    if (last && last.time !== seenAlert) { if (seenAlert) { toast(last.text, 8000); flashUntil = Date.now() + 20000; } seenAlert = last.time; }
    paintScores();
  } catch { /* relay not configured */ }
}
setInterval(pollLive, 3000); setTimeout(pollLive, 1500);
loadFavs();

async function poll() {
  if (state.busy) return; state.busy = true;
  try {
    if (state.market) {
      state.book = await api('book?marketId=' + encodeURIComponent(state.market.marketId));
      $('delayed').textContent = state.book?.isMarketDataDelayed ? 'DELAYED DATA' : '';
      if (state.sel == null) state.sel = state.book?.runners?.[0]?.selectionId ?? null;
      if (state.book) { tracker.add(state.book); drawLiquidity($('liq'), tracker); }
      drawRunners(); drawLadder(); paintScores();
    }
    drawOrders(await api('orders').catch(() => []));
  } catch (e) { toast(e.message); } finally { state.busy = false; }
}

const nameOf = id => state.market?.runners?.find(r => r.selectionId === id)?.runnerName ?? String(id);

function cell(cls, p) {
  const td = el('td', cls);
  if (p) { td.append(document.createTextNode(fmt(p.price))); td.append(el('small', '', Math.round(p.size))); }
  return td;
}
function drawRunners() {
  const body = $('runners'); body.replaceChildren();
  for (const r of state.book?.runners ?? []) {
    const tr = el('tr', 'runner' + (r.selectionId === state.sel ? ' sel' : '') + (r.status !== 'ACTIVE' ? ' out' : ''));
    const b = r.ex?.availableToBack ?? [], l = r.ex?.availableToLay ?? [];
    tr.append(el('td', 'name', nameOf(r.selectionId)), cell('b', b[2]), cell('b', b[1]), cell('b', b[0]), cell('l', l[0]), cell('l', l[1]), cell('l', l[2]),
      el('td', '', fmt(r.lastPriceTraded)), el('td', '', r.totalMatched ? Math.round(r.totalMatched) : ''));
    tr.onclick = () => { state.sel = r.selectionId; drawRunners(); drawLadder(); };
    body.append(tr);
  }
}

function drawLadder() {
  const body = $('ladder').tBodies[0]; body.replaceChildren();
  const r = state.book?.runners?.find(x => x.selectionId === state.sel);
  $('ladderTitle').textContent = r ? 'Ladder – ' + nameOf(r.selectionId) : 'Ladder';
  if (!r) return;
  const m = o => new Map((o ?? []).map(p => [p.price, p.size]));
  const back = m(r.ex?.availableToBack), lay = m(r.ex?.availableToLay), trd = m(r.ex?.tradedVolume);
  const centre = r.lastPriceTraded ?? r.ex?.availableToBack?.[0]?.price ?? 2;
  for (const price of ticks(centre, 12, 12)) {
    const tr = el('tr', price === r.lastPriceTraded ? 'ltp' : '');
    const bs = back.get(price), ls = lay.get(price);
    const tb = el('td', 'b', bs ? bs.toFixed(0) : ''), tl = el('td', 'l', ls ? ls.toFixed(0) : '');
    tb.onclick = () => bet('BACK', r.selectionId, price); tl.onclick = () => bet('LAY', r.selectionId, price);
    tr.append(el('td', 'vol', trd.get(price) ? Math.round(trd.get(price)) : ''), tb, el('td', 'price', fmt(price)), tl);
    body.append(tr);
  }
}

async function bet(side, selectionId, price) {
  const size = Number($('stake').value);
  if (!confirm(`${side} ${nameOf(selectionId)} @ ${fmt(price)} for ${size.toFixed(2)}?`)) return;
  try {
    const r = await api('place', { marketId: state.market.marketId, selectionId, side, price, size });
    toast(`Order ${r.status}${r.errorCode ? ' – ' + r.errorCode : ''}`); poll(); funds();
  } catch (e) { toast(e.message + (e.message.includes('PERMISSION') || e.message.includes('INVALID_APP_KEY') ? ' (delayed keys cannot place bets)' : ''), 6000); }
}

function drawOrders(list) {
  const body = $('orders'); body.replaceChildren();
  for (const o of list) {
    const tr = el('tr', 'runner');
    tr.append(el('td', 'name', nameOf(o.selectionId)), el('td', o.side === 'BACK' ? 'b' : 'l', o.side), el('td', '', fmt(o.price)),
      el('td', '', `${o.matched.toFixed(2)}/${o.size.toFixed(2)}`), el('td', '', o.status));
    if (o.status === 'EXECUTABLE') tr.onclick = async () => { try { await api('cancel', { marketId: o.marketId, betId: o.betId }); poll(); } catch (e) { toast(e.message); } };
    body.append(tr);
  }
}
boot();
</script>
</body>
</html>
